    <!-- step1:  Add google maps javascript api to the html file -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDBM5jToUF5MVRfSXOfeXeMCrfobRDEUDM&callback=initMap&v=weekly"
      async
    ></script>
    <script>
      // step2: Add map logic
      let map;

      // This function is executed once the Maps script finishes loading.
      // center defines long & lat coordinates for the maps centre.
      // zoom level, 0 means fully zoomed out, 20+ street level while 12 moderate zoom.
      // given NYC times square: { lat: 40.749933, lng: -73.98633 }
      // center of kampala: lat: 0.347596, lng:32.582520

      async function initMap() {
        /* create the map object with specifics of where to place the map & its startup center plus zooming details */
        map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 0.347596, lng: 32.58252 },
          zoom: 13,
        });

        /* create a traffic layer object */
        const trafficLayer = new google.maps.TrafficLayer();

        // Associate the trafficlayer to our map.
        trafficLayer.setMap(map);

        /* create a directions service plus renderer */
        const directionsService = new google.maps.DirectionsService();
        const directionsRenderer = new google.maps.DirectionsRenderer({
          map: map,
          suppressMarkers: false,
        });

        // Defining Origin, Destination and way points
        // Obtain Corridor Meta data
        // Get Corridor information: /api/v1/airQo/routes/corridor
        const response = await fetch(
          "http://localhost:4545/api/v1/airQo/routes/corridor",
        );

        const routeMetaData = await response.json();
        console.log("Route MetaData:::", routeMetaData);

        const request = {
          origin: routeMetaData.origin.name,
          destination: routeMetaData.destination.name,
          travelMode: google.maps.TravelMode.DRIVING,
          waypoints: routeMetaData.waypoints.map((waypoint) => ({
            location: waypoint.name,
            stopover: true,
          })),

          optimizeWaypoints: false, // keep the order specified above.
        };

        // Calculate and Display Route
        directionsService.route(request, (result, status) => {
          if (status === "OK") {
            directionsRenderer.setDirections(result);

            // log the distance & duration
            const route = result.routes[0];
            console.log(
              "Total Distance:",
              route.legs.reduce((sum, leg) => sum + leg.distance.value, 0),
              "meters",
            );
            console.log(
              "Total Duration:",
              route.legs.reduce((sum, leg) => sum + leg.duration.value, 0),
              "seconds",
            );
          } else {
            console.error("Directions request failed:", status);
          }
        });

        /* creating a marker. Markers use google.maps.Marker class */
        // specify where we want to place the marker
        /* const myLatLng = { lat: 0.33780335374284975, lng: 32.67101655382729 }; */

        // creates a marker using the below:
        /*
        const marker = new google.maps.Marker({
          position: myLatLng,
          map,
          title: "Hello World!",
        });
        
        */

        // create an info window
        /*
        const contentString =
          "<div><h4>My Location</h4><p>Welcome to Hedwig's den</p></div>";
        */

        // create an info window using the below:

        /*
        const infoWindow = new google.maps.InfoWindow({
          content: contentString,
        });
        */

        // associate an event listener to the marker
        /*
        marker.addListener("click", () => {
          infoWindow.open({
            anchor: marker,
            map,
            shouldFocus: false,
          });
        });*/
      }
    </script>
